[project]
name = "presence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "insightface>=0.7.3",
    "onnxruntime>=1.18.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "loguru>=0.7.0",
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in argument defaults (FastAPI Depends/File/Form)
    "B904",   # raise HTTPException from None/err
    "SIM117", # nested with statements (db conn + cursor)
]

[tool.ruff.lint.isort]
known-first-party = ["database", "routers", "services"]

[tool.ty]



