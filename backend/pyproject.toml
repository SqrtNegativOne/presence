[project]
name = "presence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "insightface>=0.7.3",
    "onnxruntime>=1.18.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "loguru>=0.7.0",
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


