# docker-compose.yml
#
# Defines three services: db (PostgreSQL), backend (FastAPI), and frontend (Vite/React).
# Run with:  docker compose up --build
# Stop with: docker compose down

services:

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: presence
      POSTGRES_USER: presence
      POSTGRES_PASSWORD: presence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence -d presence"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend            # build from backend/Dockerfile
    ports:
      - "8000:8000"             # host:container — visit localhost:8000/docs
    volumes:
      - presence_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1      # print logs immediately (no buffering)
      - DATABASE_URL=postgresql://presence:presence@db:5432/presence
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend           # build from frontend/Dockerfile
    ports:
      - "5173:5173"             # visit localhost:5173
    depends_on:
      - backend                 # wait for backend container to start first
    environment:
      # Tell vite.config.js to proxy /api to the backend container.
      - BACKEND_URL=http://backend:8000

volumes:
  presence_data:
  pgdata:
