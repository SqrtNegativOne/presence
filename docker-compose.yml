# docker-compose.yml
#
# Defines two services: backend (FastAPI) and frontend (Vite/React).
# Run with:  docker compose up --build
# Stop with: docker compose down
#
# HOW CONTAINERS TALK TO EACH OTHER:
# Docker Compose puts all services on a shared private network.
# On that network, each service is reachable by its name — so the frontend
# container can reach the backend at "http://backend:8000" (not localhost).

services:

  backend:
    build: ./backend            # build from backend/Dockerfile
    ports:
      - "8000:8000"             # host:container — visit localhost:8000/docs
    volumes:
      # Mount the data/ folder from your machine into the container.
      # This means the SQLite database and downloaded InsightFace model
      # survive container restarts — they live on your disk, not inside Docker.
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1      # print logs immediately (no buffering)

  frontend:
    build: ./frontend           # build from frontend/Dockerfile
    ports:
      - "5173:5173"             # visit localhost:5173
    depends_on:
      - backend                 # wait for backend container to start first
    environment:
      # Tell vite.config.js to proxy /api to the backend container.
      # "backend" here is the service name above — Docker resolves it automatically.
      - BACKEND_URL=http://backend:8000
